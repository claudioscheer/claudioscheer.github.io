<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer photography gallery" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@1.9.6/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap"
      rel="stylesheet"
    />

    <title>Photography - Claudio Scheer</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        background: #111;
        color: #e0e0e0;
        min-height: 100vh;
      }

      .gallery-title {
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #fff;
      }

      .back-link {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #777;
        text-decoration: none;
        transition: color 0.2s ease;
        display: inline-block;
        padding: 0.5rem 0;
      }

      .back-link:hover {
        color: #fff;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
        border-radius: 2px;
      }

      .gallery-item {
        overflow: hidden;
        border-radius: 4px;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .gallery-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: opacity 0.3s ease;
        opacity: 0.85;
      }

      .gallery-item:hover img {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .gallery-item {
          transition: none;
        }
        .gallery-item img {
          transition: none;
          opacity: 1;
        }
      }
    </style>

    <script src="/js/gallery.js" async></script>
  </head>

  <body class="m-0 pt-8 pb-12">
    <div class="mx-auto px-5" style="max-width: 1200px">
      <div class="mb-6">
        <a href="/" class="back-link">&larr; Home</a>
      </div>
      <h1 class="gallery-title text-4xl mb-8">Photography</h1>
      <div
        class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3"
        id="gallery"
      ></div>
    </div>
  </body>
</html>
