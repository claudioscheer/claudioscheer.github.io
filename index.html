<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@1.9.6/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <title>Claudio Scheer</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        background: linear-gradient(160deg, #fafaf8 0%, #f3f1ec 100%);
        color: #2d2d2d;
        min-height: 100vh;
      }

      .name-heading {
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #1a1a1a;
      }

      .subtitle {
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6b6b6b;
      }

      .nav-link {
        font-weight: 400;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #555;
        text-decoration: none;
        padding: 0.5rem 0.25rem;
        border-bottom: 1.5px solid transparent;
        transition: color 0.25s ease, border-color 0.25s ease;
      }

      .nav-link:hover {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
      }

      .pgp-text {
        font-size: 0.8rem;
        color: #888;
        letter-spacing: 0.05em;
      }

      .pgp-text a {
        color: #555;
        text-decoration: none;
        border-bottom: 1px dashed #aaa;
        transition: color 0.2s ease, border-color 0.2s ease;
      }

      .pgp-text a:hover {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
      }

      .social-icon {
        opacity: 1;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .social-link:hover .social-icon {
        opacity: 1;
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 2px solid #1a1a1a;
        outline-offset: 3px;
        border-radius: 2px;
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-up {
        animation: fade-up 0.3s ease-out both;
      }

      .fade-up-delay-1 { animation-delay: 0.06s; }
      .fade-up-delay-2 { animation-delay: 0.12s; }
      .fade-up-delay-3 { animation-delay: 0.18s; }

      @media (prefers-reduced-motion: reduce) {
        .fade-up {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <nav class="flex justify-center pt-8 pb-4">
        <div class="flex items-center" style="gap: 2rem">
          <a href="/assets/resume.pdf" target="_blank" class="nav-link">
            Resume
          </a>
          <a href="/blog" class="nav-link">
            Blog
          </a>
          <a href="/gallery" class="nav-link">
            Photography
          </a>
        </div>
      </nav>

      <main class="flex flex-1 items-center justify-center" style="min-height: 0; padding-top: 3rem; padding-bottom: 3rem">
        <div class="text-center px-4">
          <h1 class="name-heading text-6xl md:text-7xl fade-up">
            Claudio Scheer
          </h1>
          <h2 class="subtitle text-sm md:text-base mt-5 fade-up fade-up-delay-1">
            Software Engineer
          </h2>
          <div class="pgp-text mt-6 fade-up fade-up-delay-2">
            <span>PGP Key ID: </span>
            <a
              href="/assets/pgp-key.txt"
              target="_blank"
              title="Public PGP Key"
            >
              50F7A2AA
            </a>
          </div>
        </div>
      </main>

      <footer class="text-center mt-16 mb-8 fade-up fade-up-delay-3">
        <ul class="flex justify-center items-center p-0" style="gap: 1.5rem; list-style: none">
          <li>
            <a
              href="https://github.com/claudioscheer"
              target="_blank"
              title="GitHub"
              class="social-link"
            >
              <img class="social-icon" style="width: 20px; height: auto" src="icons/github.svg" alt="GitHub" />
            </a>
          </li>
          <li>
            <a href="https://a1lab.com.br" target="_blank" title="A1 Lab" class="social-link">
              <img class="social-icon" style="width: 32px; height: auto" src="icons/a1-lab.svg" alt="A1 Lab" />
            </a>
          </li>
          <li>
            <a
              href="https://linkedin.com/in/claudioscheer"
              target="_blank"
              title="LinkedIn"
              class="social-link"
            >
              <img class="social-icon" style="width: 20px; height: auto" src="icons/linkedin.svg" alt="LinkedIn" />
            </a>
          </li>
          <li>
            <a href="mailto:claudioscheer@protonmail.com" title="Email" class="social-link">
              <img class="social-icon" style="width: 22px; height: auto" src="icons/mail.svg" alt="Email" />
            </a>
          </li>
        </ul>
      </footer>
    </div>
  </body>
</html>
