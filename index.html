<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer website" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Claudio Scheer</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        background: linear-gradient(160deg, #fafaf8 0%, #f3f1ec 100%);
        color: #2d2d2d;
        min-height: 100vh;
      }

      .name-heading {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #1a1a1a;
      }

      .subtitle {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6b6b6b;
      }

      .nav-link {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #555;
        text-decoration: none;
        padding-bottom: 2px;
        border-bottom: 1.5px solid transparent;
        transition: color 0.25s ease, border-color 0.25s ease;
      }

      .nav-link:hover {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
      }

      .pgp-text {
        font-size: 0.8rem;
        color: #888;
        letter-spacing: 0.05em;
      }

      .pgp-text a {
        color: #555;
        text-decoration: none;
        border-bottom: 1px dashed #aaa;
        transition: color 0.2s ease, border-color 0.2s ease;
      }

      .pgp-text a:hover {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
      }

      .social-icon {
        opacity: 0.8;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .social-icon:hover {
        opacity: 1;
        transform: scale(1.15);
      }
    </style>
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <nav class="flex justify-center pt-8 pb-4">
        <div class="flex items-center" style="gap: 2rem">
          <a href="/assets/resume.pdf" target="_blank" class="nav-link">
            Resume
          </a>
          <a href="/blog" target="_blank" class="nav-link">
            Blog
          </a>
          <a href="/gallery" class="nav-link">
            Photography
          </a>
        </div>
      </nav>

      <main class="flex flex-1 items-center justify-center" style="min-height: 0; padding-top: 3rem; padding-bottom: 3rem">
        <div class="text-center px-4">
          <h1 class="name-heading text-6xl md:text-7xl text-center">
            Claudio Scheer
          </h1>
          <h2 class="subtitle text-sm md:text-base text-center mt-5">
            Software Engineer
          </h2>
          <div class="pgp-text text-center mt-6">
            <span>PGP Key ID: </span>
            <a
              href="/assets/pgp-key.txt"
              target="_blank"
              title="Public PGP Key"
            >
              50F7A2AA
            </a>
          </div>
        </div>
      </main>

      <footer class="text-center mt-16 mb-8">
        <ul class="flex justify-center items-center p-0" style="gap: 1.5rem; list-style: none">
          <li>
            <a
              href="https://github.com/claudioscheer"
              target="_blank"
              title="GitHub"
            >
              <img class="social-icon" style="width: 20px; height: auto" src="icons/github.svg" />
            </a>
          </li>
          <li>
            <a href="https://a1lab.com.br" target="_blank" title="A1 Lab">
              <img class="social-icon" style="width: 32px; height: auto" src="icons/a1-lab.svg" />
            </a>
          </li>
          <li>
            <a
              href="https://linkedin.com/in/claudioscheer"
              target="_blank"
              title="LinkedIn"
            >
              <img class="social-icon" style="width: 20px; height: auto" src="icons/linkedin.svg" />
            </a>
          </li>
          <li>
            <a href="mailto:claudioscheer@protonmail.com" title="Email">
              <img class="social-icon" style="width: 22px; height: auto" src="icons/mail.svg" />
            </a>
          </li>
        </ul>
      </footer>
    </div>
  </body>
</html>
