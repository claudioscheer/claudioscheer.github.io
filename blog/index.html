<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer tech blog" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Blog - Claudio Scheer</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        background: linear-gradient(160deg, #fafaf8 0%, #f3f1ec 100%);
        color: #2d2d2d;
        min-height: 100vh;
      }

      .blog-title {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #1a1a1a;
      }

      .back-link {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #888;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .back-link:hover {
        color: #1a1a1a;
      }

      .tag-heading {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #888;
        border-bottom: 1px solid #e0ddd6;
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }

      .post-link {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 0.95rem;
        color: #2d2d2d;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .post-link:hover {
        color: #666;
      }

      .post-item {
        padding: 0.6rem 0;
        padding-left: 1rem;
        border-left: 2px solid #e0ddd6;
        margin-bottom: 0.25rem;
        transition: border-color 0.2s ease;
      }

      .post-item:hover {
        border-left-color: #2d2d2d;
      }
    </style>

    <script src="/js/blog.js" async></script>
  </head>

  <body class="p-8">
    <div class="mx-auto" style="max-width: 640px">
      <div class="mb-10">
        <a href="/" class="back-link">&larr; Home</a>
      </div>
      <h1 class="blog-title text-5xl mb-10">Blog</h1>
      <div id="blog-posts"></div>
    </div>
  </body>
</html>
