<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer tech blog" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@1.9.6/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <title>Blog - Claudio Scheer</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(160deg, #fafaf8 0%, #f3f1ec 100%);
        min-height: 100vh;
      }

      .back-link {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #888;
        text-decoration: none;
        transition: color 0.2s ease;
        display: inline-block;
        padding: 0.5rem 0;
      }

      .back-link:hover {
        color: #1a1a1a;
      }

      a:focus-visible {
        outline: 2px solid #1a1a1a;
        outline-offset: 3px;
        border-radius: 2px;
      }

      .markdown-body {
        font-family: "Inter", sans-serif;
        background: transparent !important;
      }

      .markdown-body pre,
      .markdown-body pre code {
        background-color: #ebe8e2 !important;
      }

      .markdown-body code {
        background-color: #ebe8e2 !important;
        padding: 0.15em 0.4em;
        border-radius: 3px;
      }

      .markdown-body pre {
        padding: 1rem 1.25rem;
        border-radius: 6px;
        border: 1px solid #e0ddd6;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .markdown-body ul,
      .markdown-body ol {
        list-style-position: outside;
        padding-left: 2em;
      }

      .markdown-body ul {
        list-style-type: disc;
      }

      .markdown-body ol {
        list-style-type: decimal;
      }
    </style>

    <script src="https://unpkg.com/showdown@2.1.0/dist/showdown.min.js" defer></script>
  </head>

  <body class="p-8">
    <div class="mx-auto" style="max-width: 720px">
      <div class="mb-8">
        <a href="/blog" class="back-link">&larr; All Posts</a>
      </div>
      <div id="post" class="markdown-body"></div>
    </div>

    <script type="text/javascript">
      fetch("/blog/hadoop/useful-things-about-hadoop.md")
        .then((response) => {
          if (!response.ok) throw new Error("Failed to load post");
          return response.text();
        })
        .then((text) => {
          const converter = new showdown.Converter({
            headerLevelStart: 1,
            strikethrough: true,
            tables: true,
          });
          const html = converter.makeHtml(text);

          const postEl = document.getElementById("post");
          postEl.innerHTML = html;

          postEl.querySelectorAll("script").forEach((s) => s.remove());
        })
        .catch(() => {
          document.getElementById("post").textContent =
            "Unable to load post. Please try again later.";
        });
    </script>
  </body>
</html>
