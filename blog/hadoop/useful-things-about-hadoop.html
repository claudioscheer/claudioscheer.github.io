<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Claudio Scheer tech blog" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.css"
    />

    <title>Blog - Claudio Scheer</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(160deg, #fafaf8 0%, #f3f1ec 100%);
        min-height: 100vh;
      }

      .back-link {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #888;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .back-link:hover {
        color: #1a1a1a;
      }

      .markdown-body {
        font-family: "Inter", sans-serif;
        background: transparent !important;
      }

      .markdown-body pre,
      .markdown-body pre code {
        background-color: #ebe8e2 !important;
      }

      .markdown-body code {
        background-color: #ebe8e2 !important;
        padding: 0.15em 0.4em;
        border-radius: 3px;
      }

      .markdown-body pre {
        padding: 1rem 1.25rem;
        border-radius: 6px;
        border: 1px solid #e0ddd6;
      }

      .markdown-body ul,
      .markdown-body ol {
        list-style-position: outside;
        padding-left: 2em;
      }

      .markdown-body ul {
        list-style-type: disc;
      }

      .markdown-body ol {
        list-style-type: decimal;
      }
    </style>

    <script src="https://unpkg.com/showdown/dist/showdown.min.js"></script>
  </head>

  <body class="p-8">
    <div class="mx-auto" style="max-width: 720px">
      <div class="mb-8">
        <a href="/blog" class="back-link">&larr; All Posts</a>
      </div>
      <div id="post" class="markdown-body"></div>
    </div>

    <script type="text/javascript">
      fetch("/blog/hadoop/useful-things-about-hadoop.md")
        .then((response) => response.text())
        .then((text) => {
          const converter = new showdown.Converter({});
          const html = converter.makeHtml(text);

          document.getElementById("post").innerHTML = html;
        });
    </script>
  </body>
</html>
